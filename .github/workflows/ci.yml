name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: payscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/payscope_test
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/payscope_test
      SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/package.json', 'pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run migrations on empty database
        run: pnpm --filter @payscope/api db:migrate
      - run: pnpm test
      - run: pnpm build

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: payscope_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/payscope_e2e
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/package.json', 'pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --no-frozen-lockfile
      - name: Write .env.local for the Playwright servers and seed
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "CREDENTIALS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            echo "DEMO_USER_PASSWORD=$DEMO_USER_PASSWORD"
            echo "CORS_ORIGIN=http://localhost:3000"
          } > .env.local
      - run: pnpm --filter @payscope/api db:migrate
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/e2e
      - name: Run E2E (Playwright seeds, starts the API and web, and waits for health)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7
