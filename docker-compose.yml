# Local Postgres can be used instead of Docker; DATABASE_URL in .env.example works for either.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: payscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d payscope']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
