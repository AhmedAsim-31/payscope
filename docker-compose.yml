# Local-only dev database: trust auth, bound to loopback. Local Postgres works too.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: payscope
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d payscope']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
